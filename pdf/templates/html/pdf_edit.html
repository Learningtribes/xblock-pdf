<%!
from django.utils.translation import ugettext as _
%>

<div class="wrapper-comp-settings editor-with-buttons is-active settings-pdf pdf-editor-modal" id="settings-tab">
    <!-- Upload Zone -->
    <div class="pdf-upload-section">
        <div class="pdf-upload-area" id="pdf-upload-zone">
            <div class="upload-icon">
                <i class="far fa-image"></i>
            </div>
            <div class="upload-prompt">
                <span class="upload-prompt-primary" id="pdf-browse-button">${_("Click to upload")}</span>
                <span class="upload-prompt-secondary">${_("or drag and drop")}</span>
            </div>
            <div class="upload-info">
                ${_("Maximum file size: {max_file_size}MB").format(max_file_size=max_file_size_in_mbs)}
            </div>
            <input type="file" id="pdf-file-input" accept=".pdf,application/pdf" multiple style="display: none;">
        </div>
    </div>

    <!-- PDF Files Grid -->
    <div class="pdf-files-section" id="pdf-files-section" style="display: none;">
        <div class="pdf-files-grid" id="pdf-files-grid">
        </div>
    </div>

    <!-- Form Fields -->
    <ul class="list-input settings-list pdf-settings-list">
        <li class="field comp-setting-entry is-set">
            <div class="wrapper-comp-setting">
                <label class="label setting-label" for="pdf_edit_display_name">${_("Name")}</label>
                <input class="input setting-input" id="pdf_edit_display_name" value="${display_name}" type="text" placeholder="${_('Place holder')}">
            </div>
        </li>

        <li class="field comp-setting-entry is-set pdf-toggle-field">
            <div class="wrapper-comp-setting">
                <div class="pdf-toggle-wrapper">
                    <label class="pdf-toggle" id="pdf-download-toggle">
                        <input type="checkbox" id="pdf_edit_allow_download" ${"checked" if allow_download else ""}>
                        <span class="pdf-toggle-slider"></span>
                    </label>
                    <span class="pdf-toggle-label">${_("PDF Download Allowed")}</span>
                </div>
            </div>
        </li>
    </ul>

    <input type="hidden" id="pdf_edit_url" value="${url}">

    <!-- Action Buttons -->
    <div class="xblock-actions pdf-actions">
        <ul>
            <li class="action-item">
                <a href="#" class="button action-cancel">${_("Cancel")}</a>
            </li>
            <li class="action-item">
                <a href="#" class="button action-primary action-save">${_("Save")}</a>
            </li>
        </ul>
    </div>
</div>
